{% extends "base.html" %}

{% block title %}
Budgets | FinanceFlow
{% endblock %}

{% block content %}

<header class="page-header">

    <div>

        <span class="eyebrow">
            PLAN AHEAD
        </span>

        <h1>
            Budgets
        </h1>

        <p class="muted">
            Give every category a monthly limit.
        </p>

    </div>

    <button
        class="primary-button"
        id="addBudgetButton"
    >
        + Add budget
    </button>

</header>


<section class="panel">

    <div
        id="budgetsGrid"
        class="budget-grid"
    ></div>

    <div
        id="budgetsEmpty"
        class="empty-state"
    >
        No budgets yet.
    </div>

</section>


<div
    id="budgetModal"
    class="modal hidden"
>

    <div
        class="modal-backdrop"
        data-close-modal
    ></div>

    <div class="modal-card">

        <div class="modal-header">

            <div>

                <span class="eyebrow">
                    MONTHLY PLAN
                </span>

                <h2 id="budgetModalTitle">
                    Add budget
                </h2>

            </div>

            <button
                class="icon-button"
                data-close-modal
            >
                ×
            </button>

        </div>


        <form
            id="budgetForm"
            class="stack-form"
        >

            <input
                id="budgetId"
                type="hidden"
            >

            <label>

                Category

                <select
                    id="budgetCategory"
                    required
                ></select>

            </label>


            <label>

                Monthly amount

                <input
                    id="budgetAmount"
                    type="number"
                    min="0.01"
                    step="0.01"
                    required
                >

            </label>


            <div class="two-col">

                <label>

                    Month

                    <input
                        id="budgetMonth"
                        type="number"
                        min="1"
                        max="12"
                        required
                    >

                </label>

                <label>

                    Year

                    <input
                        id="budgetYear"
                        type="number"
                        min="2020"
                        max="2100"
                        required
                    >

                </label>

            </div>


            <div
                id="budgetError"
                class="form-error"
            ></div>


            <button
                class="primary-button wide"
                type="submit"
            >
                Save budget
            </button>

        </form>

    </div>

</div>

{% endblock %}

{% block scripts %}

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/budgets.js') }}"></script>

{% endblock %}
