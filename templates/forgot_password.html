<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | FinanceFlow
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-decoration decoration-one"></div>
        <div class="auth-decoration decoration-two"></div>

        <section class="auth-card">

            <div class="auth-brand">

                <span class="brand-mark">
                    F
                </span>

                <span>
                    FinanceFlow
                </span>

            </div>

            <div class="auth-heading">

                <span class="eyebrow">
                    ACCOUNT RECOVERY
                </span>

                <h1>
                    Forgot your password?
                </h1>

                <p>
                    Enter the email connected to your
                    FinanceFlow account and we'll send
                    you a verification code.
                </p>

            </div>

            <form id="forgotPasswordForm">

                <div class="form-group">

                    <label for="forgotEmail">
                        Email
                    </label>

                    <input
                        id="forgotEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-button wide"
                    id="sendCodeButton"
                >
                    Send verification code
                </button>

                <p
                    id="forgotPasswordMessage"
                    class="form-message"
                ></p>

            </form>

            <div class="auth-footer">

                <a href="{{ url_for('login') }}">
                    ← Back to login
                </a>

            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>

</body>

</html>
